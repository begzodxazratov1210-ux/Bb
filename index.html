<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilon O'yini - Snake Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f172a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(to right, #22c55e, #10b981, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .score-board {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .score-box {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .score-box span {
            color: #22c55e;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.2);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(34, 197, 94, 0.4);
        }

        canvas {
            background-color: #1e293b;
            display: block;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            backdrop-filter: blur(4px);
        }

        .overlay h2 {
            font-size: 1.8rem;
            color: #ef4444;
        }

        .btn {
            background: #22c55e;
            color: #0f172a;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
        }

        .btn:hover {
            background: #16a34a;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(34, 197, 94, 0.6);
        }

        /* Mobil boshqaruv tugmalari */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 55px);
            grid-template-rows: repeat(3, 55px);
            gap: 8px;
            margin-top: 15px;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1.3rem;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
        }

        .ctrl-btn:active {
            background: #22c55e;
            color: #0f172a;
        }

        .ctrl-up { grid-column: 2; grid-row: 1; }
        .ctrl-left { grid-column: 1; grid-row: 2; }
        .ctrl-right { grid-column: 3; grid-row: 2; }
        .ctrl-down { grid-column: 2; grid-row: 3; }

        @media (min-width: 768px) {
            .controls {
                display: none; /* Kompyuterda mobil tugmalar yashiriladi */
            }
        }
    </style>
</head>
<body>

    <h1>Ilon O'yini</h1>

    <div class="score-board">
        <div class="score-box">Ochko: <span id="score">0</span></div>
        <div class="score-box">Rekord: <span id="high-score">0</span></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div id="gameOverlay" class="overlay">
            <h2 id="overlayTitle">O'yinni Boshlash</h2>
            <button class="btn" onclick="startGame()">Boshlash</button>
        </div>
    </div>

    <!-- Mobil boshqaruv -->
    <div class="controls">
        <button class="ctrl-btn ctrl-up" onclick="setDirection('UP')">▲</button>
        <button class="ctrl-btn ctrl-left" onclick="setDirection('LEFT')">◀</button>
        <button class="ctrl-btn ctrl-right" onclick="setDirection('RIGHT')">▶</button>
        <button class="ctrl-btn ctrl-down" onclick="setDirection('DOWN')">▼</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const highScoreEl = document.getElementById("high-score");
        const overlay = document.getElementById("gameOverlay");
        const overlayTitle = document.getElementById("overlayTitle");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = gridSize;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        let gameInterval = null;
        let isGameRunning = false;
        let nextDirection = { dx: gridSize, dy: 0 };

        highScoreEl.innerText = highScore;

        function startGame() {
            snake = [
                { x: 10 * gridSize, y: 10 * gridSize },
                { x: 9 * gridSize, y: 10 * gridSize },
                { x: 8 * gridSize, y: 10 * gridSize }
            ];
            dx = gridSize;
            dy = 0;
            nextDirection = { dx: gridSize, dy: 0 };
            score = 0;
            scoreEl.innerText = score;
            spawnFood();
            
            overlay.style.display = "none";
            isGameRunning = true;

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 100);
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * tileCount) * gridSize;
            food.y = Math.floor(Math.random() * tileCount) * gridSize;

            // Ovqat ilon tanasiga tushib qolmasligini tekshirish
            snake.forEach(segment => {
                if (segment.x === food.x && segment.y === food.y) {
                    spawnFood();
                }
            });
        }

        function gameLoop() {
            dx = nextDirection.dx;
            dy = nextDirection.dy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Devorga urilish
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                return gameOver();
            }

            // O'z tanasiga urilish
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return gameOver();
                }
            }

            snake.unshift(head);

            // Ovqatni yeyish
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.innerText = highScore;
                    localStorage.setItem("snakeHighScore", highScore);
                }
                spawnFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            // Foni tozalash
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Katakchalar chizish (To'r ko'rinishi)
            ctx.strokeStyle = "rgba(255, 255, 255, 0.03)";
            for (let i = 0; i < canvas.width; i += gridSize) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Ovqatni chizish
            ctx.fillStyle = "#ef4444";
            ctx.shadowColor = "#ef4444";
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(food.x + gridSize / 2, food.y + gridSize / 2, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Ilonni chizish
            snake.forEach((segment, index) => {
                if (index === 0) {
                    ctx.fillStyle = "#22c55e"; // Boshi
                } else {
                    ctx.fillStyle = "#16a34a"; // Tanasi
                }

                ctx.beginPath();
                ctx.roundRect(segment.x + 1, segment.y + 1, gridSize - 2, gridSize - 2, 4);
                ctx.fill();
            });
        }

        function gameOver() {
            clearInterval(gameInterval);
            isGameRunning = false;
            overlayTitle.innerText = "O'yin Tugadi!";
            overlay.style.display = "flex";
        }

        function setDirection(dir) {
            if (!isGameRunning) return;

            if (dir === 'UP' && dy === 0) nextDirection = { dx: 0, dy: -gridSize };
            if (dir === 'DOWN' && dy === 0) nextDirection = { dx: 0, dy: gridSize };
            if (dir === 'LEFT' && dx === 0) nextDirection = { dx: -gridSize, dy: 0 };
            if (dir === 'RIGHT' && dx === 0) nextDirection = { dx: gridSize, dy: 0 };
        }

        // Klaviatura tugmalari
        window.addEventListener("keydown", e => {
            if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") setDirection('UP');
            if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") setDirection('DOWN');
            if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") setDirection('LEFT');
            if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") setDirection('RIGHT');
        });
    </script>
</body>
</html>
