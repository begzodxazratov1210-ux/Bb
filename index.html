<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish va So'rovnoma</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f8fafc;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            color: #94a3b8;
            font-size: 14px;
        }

        /* Progress Bar */
        .progress-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            position: relative;
        }

        .progress-container::before {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            height: 4px;
            width: 100%;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1;
        }

        .progress-bar-line {
            position: absolute;
            background: linear-gradient(to right, #6366f1, #a855f7);
            height: 4px;
            width: 0%;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1;
            transition: width 0.4s ease;
        }

        .step-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #1e293b;
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            z-index: 2;
            transition: all 0.3s ease;
        }

        .step-circle.active {
            border-color: #818cf8;
            background: #4f46e5;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
        }

        .step-circle.completed {
            background: #10b981;
            border-color: #10b981;
            color: #ffffff;
        }

        /* Form Steps */
        .form-step {
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        .form-step.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .step-title {
            font-size: 18px;
            color: #e2e8f0;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #cbd5e1;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 15px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group textarea {
            padding-left: 14px;
            resize: vertical;
            min-height: 80px;
        }

        .form-group select option {
            background: #0f172a;
            color: #ffffff;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #818cf8;
            box-shadow: 0 0 10px rgba(129, 140, 248, 0.3);
            background: rgba(15, 23, 42, 0.8);
        }

        /* Checkbox & Radio Cards */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-top: 8px;
        }

        .option-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .option-card:hover {
            border-color: rgba(129, 140, 248, 0.5);
            background: rgba(30, 41, 59, 0.7);
        }

        .option-card input {
            display: none;
        }

        .option-card input:checked + span {
            color: #38bdf8;
            font-weight: 600;
        }

        .option-card.selected {
            border-color: #818cf8;
            background: rgba(99, 102, 241, 0.2);
        }

        /* Navigatsiya tugmalari */
        .btn-group {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-prev {
            background: rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
        }

        .btn-prev:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .btn-next, .btn-submit {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: #ffffff;
            margin-left: auto;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .btn-next:hover, .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        /* Natija oynasi */
        .success-card {
            text-align: center;
            padding: 20px 0;
            display: none;
        }

        .success-icon {
            font-size: 60px;
            color: #10b981;
            margin-bottom: 15px;
            animation: bounce 1s ease infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        .summary-box {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.8;
        }

        .summary-box strong {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Ro'yxatdan O'tish</h1>
            <p>Ma'lumotlaringizni to'ldiring va so'rovnomada qatnashing</p>
        </div>

        <!-- Progress Indicator -->
        <div class="progress-container">
            <div class="progress-bar-line" id="progressLine"></div>
            <div class="step-circle active" id="step1-indicator">1</div>
            <div class="step-circle" id="step2-indicator">2</div>
            <div class="step-circle" id="step3-indicator">3</div>
        </div>

        <form id="multiStepForm" onsubmit="return false;">
            <!-- 1-BOSQICH: Shaxsiy Ma'lumotlar -->
            <div class="form-step active" id="step1">
                <div class="step-title">
                    <i class="fa-solid fa-user"></i> Shaxsiy Ma'lumotlar
                </div>
                
                <div class="form-group">
                    <label for="fullname">Ism va Familiya *</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-id-card"></i>
                        <input type="text" id="fullname" placeholder="Anvar Aliyev" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone">Telefon raqam *</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" id="phone" value="+998 " placeholder="+998 90 123 45 67" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Elektron pochta (ixtiyoriy)</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="example@mail.com">
                    </div>
                </div>
            </div>

            <!-- 2-BOSQICH: Manzil va Hudud -->
            <div class="form-step" id="step2">
                <div class="step-title">
                    <i class="fa-solid fa-location-dot"></i> Manzil Ma'lumotlari
                </div>

                <div class="form-group">
                    <label for="region">Viloyat / Hudud *</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-city"></i>
                        <select id="region" required>
                            <option value="">Hududni tanlang</option>
                            <option value="Toshkent shahri">Toshkent shahri</option>
                            <option value="Toshkent viloyati">Toshkent viloyati</option>
                            <option value="Samarqand">Samarqand</option>
                            <option value="Farg'ona">Farg'ona</option>
                            <option value="Andijon">Andijon</option>
                            <option value="Namangan">Namangan</option>
                            <option value="Buxoro">Buxoro</option>
                            <option value="Xorazm">Xorazm</option>
                            <option value="Qashqadaryo">Qashqadaryo</option>
                            <option value="Surxondaryo">Surxondaryo</option>
                            <option value="Navoiy">Navoiy</option>
                            <option value="Jizzax">Jizzax</option>
                            <option value="Sirdaryo">Sirdaryo</option>
                            <option value="Qoraqalpog'iston R.">Qoraqalpog'iston R.</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">Aniq manzil (Tuman, ko'cha, uy) *</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-house"></i>
                        <input type="text" id="address" placeholder="Yunusobod tumani, 4-mavze, 12-uy" required>
                    </div>
                </div>
            </div>

            <!-- 3-BOSQICH: So'rovnoma -->
            <div class="form-step" id="step3">
                <div class="step-title">
                    <i class="fa-solid fa-clipboard-question"></i> So'rovnoma & Qiziqishlar
                </div>

                <div class="form-group">
                    <label>Qaysi sohada faoliyat yuritasiz?</label>
                    <div class="options-grid">
                        <label class="option-card">
                            <input type="radio" name="occupation" value="Talaba/O'quvchi">
                            <span>Talaba</span>
                        </label>
                        <label class="option-card">
                            <input type="radio" name="occupation" value="IT / Texnologiya">
                            <span>IT / Dasturlash</span>
                        </label>
                        <label class="option-card">
                            <input type="radio" name="occupation" value="Tadbirkorlik">
                            <span>Tadbirkor</span>
                        </label>
                        <label class="option-card">
                            <input type="radio" name="occupation" value="Boshqa">
                            <span>Boshqa</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Sizga bog'lanish uchun qaysi vaqt qulay?</label>
                    <div class="options-grid">
                        <label class="option-card">
                            <input type="radio" name="time" value="Ertalab (09:00 - 12:00)">
                            <span>09:00 - 12:00</span>
                        </label>
                        <label class="option-card">
                            <input type="radio" name="time" value="Tushdan so'ng (14:00 - 18:00)">
                            <span>14:00 - 18:00</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="notes">Qo'shimcha taklif yoki izohingiz</label>
                    <textarea id="notes" placeholder="Izoh qoldiring..."></textarea>
                </div>
            </div>

            <!-- Navigatsiya Tugmalari -->
            <div class="btn-group" id="navBtns">
                <button type="button" class="btn btn-prev" id="prevBtn" onclick="changeStep(-1)" style="display: none;">
                    <i class="fa-solid fa-arrow-left"></i> Ortga
                </button>
                <button type="button" class="btn btn-next" id="nextBtn" onclick="changeStep(1)">
                    Keyingisi <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </form>

        <!-- Yakuniy Natija -->
        <div class="success-card" id="successCard">
            <i class="fa-solid fa-circle-check success-icon"></i>
            <h2>Muvaffaqiyatli Ro'yxatdan O'tdingiz!</h2>
            <p style="color: #94a3b8; margin-top: 5px;">Ma'lumotlaringiz qabul qilindi.</p>
            
            <div class="summary-box" id="summaryBox"></div>

            <button class="btn btn-next" onclick="location.reload()" style="margin: 20px auto 0 auto;">
                Qayta to'ldirish
            </button>
        </div>
    </div>

    <script>
        let currentStep = 1;
        const totalSteps = 3;

        // Option kartalarni belgilash vizual effekti
        document.querySelectorAll('.option-card').forEach(card => {
            card.addEventListener('click', function() {
                const radio = this.querySelector('input[type="radio"]');
                if (radio) {
                    const name = radio.getAttribute('name');
                    document.querySelectorAll(`input[name="${name}"]`).forEach(r => {
                        r.closest('.option-card').classList.remove('selected');
                    });
                    this.classList.add('selected');
                }
            });
        });

        function changeStep(delta) {
            // Validatsiya tekshiruvi (oldinga o'tganda)
            if (delta === 1 && !validateStep(currentStep)) {
                return;
            }

            currentStep += delta;

            if (currentStep > totalSteps) {
                submitForm();
                return;
            }

            showStep(currentStep);
        }

        function showStep(step) {
            // Barcha step-larni yashirish
            document.querySelectorAll('.form-step').forEach(s => s.classList.remove('active'));
            // Joriy step-ni ko'rsatish
            document.getElementById(`step${step}`).classList.add('active');

            // Progress bar va indikatorlarni yangilash
            const progressPercent = ((step - 1) / (totalSteps - 1)) * 100;
            document.getElementById('progressLine').style.width = `${progressPercent}%`;

            for (let i = 1; i <= totalSteps; i++) {
                const indicator = document.getElementById(`step${i}-indicator`);
                if (i < step) {
                    indicator.className = 'step-circle completed';
                    indicator.innerHTML = '<i class="fa-solid fa-check"></i>';
                } else if (i === step) {
                    indicator.className = 'step-circle active';
                    indicator.innerText = i;
                } else {
                    indicator.className = 'step-circle';
                    indicator.innerText = i;
                }
            }

            // Tugmalarni moslashtirish
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            if (step === 1) {
                prevBtn.style.display = 'none';
            } else {
                prevBtn.style.display = 'flex';
            }

            if (step === totalSteps) {
                nextBtn.innerHTML = 'Yuborish <i class="fa-solid fa-paper-plane"></i>';
                nextBtn.className = 'btn btn-submit';
            } else {
                nextBtn.innerHTML = 'Keyingisi <i class="fa-solid fa-arrow-right"></i>';
                nextBtn.className = 'btn btn-next';
            }
        }

        function validateStep(step) {
            if (step === 1) {
                const name = document.getElementById('fullname').value.trim();
                const phone = document.getElementById('phone').value.trim();
                if (!name) {
                    alert("Iltimos, ism va familiyangizni kiriting!");
                    return false;
                }
                if (phone.length < 9) {
                    alert("Iltimos, to'liq telefon raqamingizni kiriting!");
                    return false;
                }
            } else if (step === 2) {
                const region = document.getElementById('region').value;
                const address = document.getElementById('address').value.trim();
                if (!region) {
                    alert("Iltimos, viloyatni tanlang!");
                    return false;
                }
                if (!address) {
                    alert("Iltimos, manzilingizni kiriting!");
                    return false;
                }
            }
            return true;
        }

        function submitForm() {
            // Forma ma'lumotlarini yig'ish
            const name = document.getElementById('fullname').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value || "Kiritilmadi";
            const region = document.getElementById('region').value;
            const address = document.getElementById('address').value;
            
            const occEl = document.querySelector('input[name="occupation"]:checked');
            const occupation = occEl ? occEl.value : "Tanlanmadi";
            
            const timeEl = document.querySelector('input[name="time"]:checked');
            const time = timeEl ? timeEl.value : "Tanlanmadi";

            const notes = document.getElementById('notes').value || "Izoh yo'q";

            // Natijani shakllantirish
            const summaryHtml = `
                <strong>Ism:</strong> ${name}<br>
                <strong>Tel:</strong> ${phone}<br>
                <strong>Email:</strong> ${email}<br>
                <strong>Manzil:</strong> ${region}, ${address}<br>
                <strong>Soha:</strong> ${occupation}<br>
                <strong>Qulay vaqt:</strong> ${time}<br>
                <strong>Izoh:</strong> ${notes}
            `;

            document.getElementById('summaryBox').innerHTML = summaryHtml;

            // Formani yashirish, natijani ko'rsatish
            document.getElementById('multiStepForm').style.display = 'none';
            document.querySelector('.progress-container').style.display = 'none';
            document.getElementById('successCard').style.display = 'block';
        }
    </script>

</body>
</html>
