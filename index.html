<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris O'yini</title>
    <link href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            letter-spacing: 3px;
            background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .main-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .game-wrapper {
            position: relative;
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
            overflow: hidden;
        }

        canvas#tetris {
            display: block;
            background: #090d16;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 140px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .card h3 {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .card .value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #38bdf8;
        }

        canvas#next {
            display: block;
            margin: 0 auto;
            background: transparent;
        }

        .btn {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            font-size: 0.9rem;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* Overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 10;
        }

        .overlay h2 {
            font-size: 1.8rem;
            color: #f43f5e;
        }

        /* Mobil Boshqaruv Tugmalari */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
        }

        .ctrl-row {
            display: flex;
            gap: 8px;
        }

        .ctrl-btn {
            width: 55px;
            height: 55px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1.2rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
        }

        .ctrl-btn:active {
            background: #6366f1;
        }

        .ctrl-wide {
            width: 118px;
        }

        @media (min-width: 768px) {
            .controls {
                display: none;
            }
        }
    </style>
</head>
<body>

    <h1>Tetris</h1>

    <div class="main-layout">
        <div class="game-wrapper">
            <canvas id="tetris" width="240" height="400"></canvas>
            
            <div id="overlay" class="overlay">
                <h2 id="overlayTitle">Tetris O'yini</h2>
                <button class="btn" style="width: auto; padding: 12px 24px;" onclick="startGame()">Boshlash</button>
            </div>
        </div>

        <div class="side-panel">
            <div class="card">
                <h3>Keyingisi</h3>
                <canvas id="next" width="80" height="80"></canvas>
            </div>
            <div class="card">
                <h3>Ochko</h3>
                <div class="value" id="score">0</div>
            </div>
            <div class="card">
                <h3>Bosqich</h3>
                <div class="value" id="level">1</div>
            </div>
            <div class="card">
                <h3>Qatorlar</h3>
                <div class="value" id="lines">0</div>
            </div>
            <button class="btn" id="pauseBtn" onclick="togglePause()">Pauza</button>
        </div>
    </div>

    <!-- Mobil uchun tugmalar -->
    <div class="controls">
        <div class="ctrl-row">
            <button class="ctrl-btn" onclick="playerRotate()"><i class="fa-solid fa-rotate-right"></i></button>
        </div>
        <div class="ctrl-row">
            <button class="ctrl-btn" onclick="playerMove(-1)"><i class="fa-solid fa-arrow-left"></i></button>
            <button class="ctrl-btn" onclick="playerDrop()"><i class="fa-solid fa-arrow-down"></i></button>
            <button class="ctrl-btn" onclick="playerMove(1)"><i class="fa-solid fa-arrow-right"></i></button>
        </div>
        <div class="ctrl-row">
            <button class="ctrl-btn ctrl-wide" onclick="playerHardDrop()"><i class="fa-solid fa-angles-down"></i> Tashlash</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tetris');
        const context = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next');
        const nextContext = nextCanvas.getContext('2d');

        context.scale(20, 20);
        nextContext.scale(20, 20);

        const COLORS = [
            null,
            '#00f0f0', // I - Cyan
            '#0000f0', // J - Blue
            '#f0a000', // L - Orange
            '#f0f000', // O - Yellow
            '#00f000', // S - Green
            '#a000f0', // T - Purple
            '#f00000'  // Z - Red
        ];

        // Tetris shakllari (PIECES)
        function createPiece(type) {
            if (type === 'I') {
                return [
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                    [0, 1, 0, 0],
                ];
            } else if (type === 'J') {
                return [
                    [0, 2, 0],
                    [0, 2, 0],
                    [2, 2, 0],
                ];
            } else if (type === 'L') {
                return [
                    [0, 3, 0],
                    [0, 3, 0],
                    [0, 3, 3],
                ];
            } else if (type === 'O') {
                return [
                    [4, 4],
                    [4, 4],
                ];
            } else if (type === 'S') {
                return [
                    [0, 5, 5],
                    [5, 5, 0],
                    [0, 0, 0],
                ];
            } else if (type === 'T') {
                return [
                    [0, 6, 0],
                    [6, 6, 6],
                    [0, 0, 0],
                ];
            } else if (type === 'Z') {
                return [
                    [7, 7, 0],
                    [0, 7, 7],
                    [0, 0, 0],
                ];
            }
        }

        const arena = createMatrix(12, 20);

        const player = {
            pos: {x: 0, y: 0},
            matrix: null,
            next: null,
            score: 0,
            lines: 0,
            level: 1
        };

        let dropCounter = 0;
        let dropInterval = 1000;
        let lastTime = 0;
        let isPaused = false;
        let isGameOver = false;

        function createMatrix(w, h) {
            const matrix = [];
            while (h--) {
                matrix.push(new Array(w).fill(0));
            }
            return matrix;
        }

        function collide(arena, player) {
            const [m, o] = [player.matrix, player.pos];
            for (let y = 0; y < m.length; ++y) {
                for (let x = 0; x < m[y].length; ++x) {
                    if (m[y][x] !== 0 &&
                       (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                        return true;
                    }
                }
            }
            return false;
        }

        function merge(arena, player) {
            player.matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        arena[y + player.pos.y][x + player.pos.x] = value;
                    }
                });
            });
        }

        function rotate(matrix, dir) {
            for (let y = 0; y < matrix.length; ++y) {
                for (let x = 0; x < y; ++x) {
                    [
                        matrix[x][y],
                        matrix[y][x],
                    ] = [
                        matrix[y][x],
                        matrix[x][y],
                    ];
                }
            }
            if (dir > 0) {
                matrix.forEach(row => row.reverse());
            } else {
                matrix.reverse();
            }
        }

        function playerRotate() {
            if (isPaused || isGameOver) return;
            const pos = player.pos.x;
            let offset = 1;
            rotate(player.matrix, 1);
            while (collide(arena, player)) {
                player.pos.x += offset;
                offset = -(offset + (offset > 0 ? 1 : -1));
                if (offset > player.matrix[0].length) {
                    rotate(player.matrix, -1);
                    player.pos.x = pos;
                    return;
                }
            }
        }

        function playerMove(dir) {
            if (isPaused || isGameOver) return;
            player.pos.x += dir;
            if (collide(arena, player)) {
                player.pos.x -= dir;
            }
        }

        function playerDrop() {
            if (isPaused || isGameOver) return;
            player.pos.y++;
            if (collide(arena, player)) {
                player.pos.y--;
                merge(arena, player);
                playerReset();
                arenaSweep();
                updateScore();
            }
            dropCounter = 0;
        }

        function playerHardDrop() {
            if (isPaused || isGameOver) return;
            while (!collide(arena, player)) {
                player.pos.y++;
            }
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            updateScore();
            dropCounter = 0;
        }

        function getRandomPiece() {
            const pieces = 'IJLOSTZ';
            return createPiece(pieces[pieces.length * Math.random() | 0]);
        }

        function playerReset() {
            if (!player.next) {
                player.next = getRandomPiece();
            }
            player.matrix = player.next;
            player.next = getRandomPiece();
            player.pos.y = 0;
            player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

            drawNext();

            if (collide(arena, player)) {
                isGameOver = true;
                document.getElementById('overlayTitle').innerText = "O'yin Tugadi!";
                document.getElementById('overlay').style.display = 'flex';
            }
        }

        function arenaSweep() {
            let rowCount = 1;
            outer: for (let y = arena.length - 1; y >= 0; --y) {
                for (let x = 0; x < arena[y].length; ++x) {
                    if (arena[y][x] === 0) {
                        continue outer;
                    }
                }

                const row = arena.splice(y, 1)[0].fill(0);
                arena.unshift(row);
                ++y;

                player.score += rowCount * 10;
                player.lines += 1;
                rowCount *= 2;

                // Har 10 ta qatorda bosqich ko'tariladi
                player.level = Math.floor(player.lines / 10) + 1;
                dropInterval = Math.max(100, 1000 - (player.level - 1) * 100);
            }
        }

        function drawMatrix(matrix, offset, ctx = context) {
            matrix.forEach((row, y) => {
                row.forEach((value, x) => {
                    if (value !== 0) {
                        ctx.fillStyle = COLORS[value];
                        ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
                        
                        // Ichki ramka/shakllantirish
                        ctx.fillStyle = 'rgba(255,255,255,0.2)';
                        ctx.fillRect(x + offset.x, y + offset.y, 1, 0.1);
                        ctx.fillRect(x + offset.x, y + offset.y, 0.1, 1);
                    }
                });
            });
        }

        function drawNext() {
            nextContext.fillStyle = '#090d16';
            nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

            const offset = {
                x: (4 - player.next[0].length) / 2,
                y: (4 - player.next.length) / 2
            };
            drawMatrix(player.next, offset, nextContext);
        }

        function draw() {
            context.fillStyle = '#090d16';
            context.fillRect(0, 0, canvas.width, canvas.height);

            // Katakcha ramkalari
            context.strokeStyle = 'rgba(255, 255, 255, 0.02)';
            context.lineWidth = 0.05;
            for (let x = 0; x < 12; x++) {
                for (let y = 0; y < 20; y++) {
                    context.strokeRect(x, y, 1, 1);
                }
            }

            drawMatrix(arena, {x: 0, y: 0});
            if (player.matrix) {
                drawMatrix(player.matrix, player.pos);
            }
        }

        function updateScore() {
            document.getElementById('score').innerText = player.score;
            document.getElementById('level').innerText = player.level;
            document.getElementById('lines').innerText = player.lines;
        }

        function update(time = 0) {
            if (isPaused || isGameOver) return;

            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                playerDrop();
            }

            draw();
            requestAnimationFrame(update);
        }

        function startGame() {
            arena.forEach(row => row.fill(0));
            player.score = 0;
            player.lines = 0;
            player.level = 1;
            dropInterval = 1000;
            isGameOver = false;
            isPaused = false;
            updateScore();
            
            document.getElementById('overlay').style.display = 'none';
            playerReset();
            lastTime = performance.now();
            update();
        }

        function togglePause() {
            if (isGameOver) return;
            isPaused = !isPaused;
            const pauseBtn = document.getElementById('pauseBtn');
            if (isPaused) {
                pauseBtn.innerText = 'Davom etish';
                document.getElementById('overlayTitle').innerText = 'Pauza';
                document.getElementById('overlay').style.display = 'flex';
            } else {
                pauseBtn.innerText = 'Pauza';
                document.getElementById('overlay').style.display = 'none';
                lastTime = performance.now();
                update();
            }
        }

        // Klaviatura boshqaruvi
        document.addEventListener('keydown', event => {
            if (event.key === 'ArrowLeft' || event.key === 'a' || event.key === 'A') {
                playerMove(-1);
            } else if (event.key === 'ArrowRight' || event.key === 'd' || event.key === 'D') {
                playerMove(1);
            } else if (event.key === 'ArrowDown' || event.key === 's' || event.key === 'S') {
                playerDrop();
            } else if (event.key === 'ArrowUp' || event.key === 'w' || event.key === 'W') {
                playerRotate();
            } else if (event.key === ' ') {
                playerHardDrop();
            } else if (event.key === 'p' || event.key === 'P') {
                togglePause();
            }
        });
    </script>
</body>
</html>
