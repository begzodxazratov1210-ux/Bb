<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris O'yini</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            letter-spacing: 3px;
            background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .main-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .game-wrapper {
            position: relative;
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
            overflow: hidden;
        }

        canvas#tetris {
            display: block;
            background: #090d16;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 140px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .card h3 {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .card .value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #38bdf8;
        }

        canvas#next {
            display: block;
            margin: 0 auto;
            background: transparent;
        }

        .btn {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            font-size: 0.9rem;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* Overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 10;
        }

        .overlay h2 {
            font-size: 1.8rem;
            color: #f43f5e;
        }

        /* Mobil Boshqaruv Tugmalari */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
        }

        .ctrl-row {
            display: flex;
            gap: 8px;
        }

        .ctrl-btn {
            width: 55px;
            height: 55px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1.2rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
        }

        .ctrl-btn:active {
            background: #6366f1;
        }

        .ctrl-wide {
            width: 118px;
        }

        @media (min-width: 768px) {
            .controls {
                display: none;
            }
        }
    </style>
</head>
<body>

    <h1>Tetris</h1>

    <div class="main-layout">
        <div class="game-wrapper">
            <canvas id="tetris" width="240" height="400"></canvas>
            
            <div id="overlay" class="overlay">
                <h2 id="overlayTitle">Tetris O'yini</h2>
                <button class="btn" style="width: auto; padding: 12px 24px;" onclick="startGame()">Boshlash</button>
            </div>
        </div>

        <div class="side-panel">
            <div class="card">
                <h3>Keyingisi</h3>
                <canvas id="next" width="80" height="80"></canvas>
            </div>
            <div class="card">
                <h3>Ochko</h3>
                <div class="value" id="score">0</div>
            </div>
            <div
